<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runtime constraint: HMR is disabled in AI Studio. Ignore WebSocket connection errors.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('vite:ws') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.filename || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
